name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Registr čísel (zdroje, místa použití, shoda se studií)
        run: pnpm check:cisla
      - name: Vazby opatření (žádná vazba proti času, organigramy úplné)
        run: pnpm check:vazby
      - name: Testy (PGlite, bez sdílené databáze)
        run: pnpm test
      - name: Build
        run: pnpm build
